name: Suunto 7 API 28 Build

on:
  workflow_dispatch:
  push:
    branches:
      - suunto7-api28

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-37|build-tools;37" || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build optimized Wear OS APK
        run: ./gradlew :app:assembleBenchmark --stacktrace

      - name: Upload Suunto 7 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GlanceMap-Suunto7-API28-Optimized
          path: app/build/outputs/apk/benchmark/app-benchmark.apk
